<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Defensive shim for browser extensions attempting to intercept window.fetch */
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _fetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Silently continue if window is sealed
        }

        /* Suppress external errors emitted by browser extensions */
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
